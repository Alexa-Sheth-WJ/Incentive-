<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Attendance Program Reminder</title>
<style>
:root{
  --ink:#FFFFFF; --soft:rgba(255,255,255,.86); --panel:rgba(4,14,34,.38); --panel-line:rgba(255,232,170,.35);
  --gold1:#FFF4C9; --gold2:#F9CB4E; --gold3:#C9860E; --gold4:#F4BE3E; --gold-edge:#7A4A06;
  --orange:#F07C22; --teal:#2BB3B1;
  --ok:#3DBE7A; --warn:#F2B33D; --bad:#E5534B;
  --lift:0%;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --panel:rgba(4,14,34,.30); --lift:14%; color-scheme:light; }
}
/* Month palettes, drawn from the program flyers (Sept blue/orange, Oct maroon/gold) */
.t-sep{--s1:#071F45;--s2:#0F64A3;--s3:#E8792B}
.t-oct{--s1:#3A0812;--s2:#7E1F2E;--s3:#D8692A}
.t-nov{--s1:#22093A;--s2:#5A2770;--s3:#E09422}
.t-dec{--s1:#04291F;--s2:#0D5C44;--s3:#D3A72C}
.t-jan{--s1:#08163A;--s2:#1E3478;--s3:#C9952A}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;height:100%}
body{display:flex;align-items:flex-start;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased}
.frame{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;overflow:hidden;border-radius:18px;
  container-type:size;container-name:frame;isolation:isolate;
  background:
    radial-gradient(120% 70% at 85% 110%, color-mix(in srgb,var(--s3) 75%,transparent) 0%, transparent 60%),
    radial-gradient(90% 60% at 10% -10%, color-mix(in srgb,var(--s2) 80%,white var(--lift)) 0%, transparent 70%),
    linear-gradient(130deg, color-mix(in srgb,var(--s1) 100%,white var(--lift)) 0%, color-mix(in srgb,var(--s2) 100%,white var(--lift)) 55%, var(--s3) 130%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
/* sparkle field */
.stars{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.75;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 28% 62%,#fff 98%,transparent),
    radial-gradient(1.4px 1.4px at 44% 12%,#ffe7a3 98%,transparent),radial-gradient(1px 1px at 63% 38%,#fff 98%,transparent),
    radial-gradient(1.3px 1.3px at 78% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 66%,#ffe7a3 98%,transparent),
    radial-gradient(1.2px 1.2px at 7% 84%,#fff 98%,transparent),radial-gradient(1px 1px at 52% 88%,#fff 98%,transparent),
    radial-gradient(1.1px 1.1px at 35% 34%,#fff 98%,transparent),radial-gradient(1px 1px at 95% 9%,#fff 98%,transparent)}
.glint{position:absolute;z-index:0;width:1.1em;height:1.1em;pointer-events:none;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  background:linear-gradient(160deg,#FFFFFF,#F9CB4E);
  animation:twinkle 2.4s ease-in-out infinite}
.glint.g1{top:9%;left:46%;font-size:12px}.glint.g2{top:30%;right:6%;font-size:16px;animation-delay:-.8s}
.glint.g3{bottom:18%;left:4%;font-size:10px;animation-delay:-1.6s}
/* balloons */
.balloons{position:absolute;z-index:0;right:-2.5%;top:9%;width:24%;max-width:130px;pointer-events:none;
  animation:float 5.5s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
/* confetti */
.confetti{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-6%;width:7px;height:11px;border-radius:2px;opacity:0;
  animation:fall var(--d,3s) cubic-bezier(.25,.6,.4,1) var(--w,0s) 1 forwards}

.inner{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "hero" "body" "pills" "fine";
  gap:.6em;padding:1em 1.1em .8em;font-size:clamp(9px,min(3.2cqw,4.3cqh),18px)}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:.6em;min-width:0}
.kicker{font-size:.74em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4em;font-size:.72em;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;padding:.32em .8em;border-radius:999px;color:#3A2300;
  background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold4));box-shadow:0 2px 0 var(--gold-edge),0 4px 12px rgba(0,0,0,.25)}
.chip .dot{width:.55em;height:.55em;border-radius:50%;background:#C2410C;animation:status 2s ease-in-out infinite}
.hero{grid-area:hero;min-width:0;max-width:76%;padding-bottom:.12em}
h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.98;font-size:1.72em;text-wrap:balance}
h1 .l1{display:block;color:#fff;text-shadow:0 .055em 0 rgba(0,0,0,.28),0 .12em .3em rgba(0,0,0,.35)}
h1 .l2{display:block;font-size:1.18em}
.gold{background:linear-gradient(180deg,var(--gold1) 0%,var(--gold2) 42%,var(--gold3) 58%,var(--gold4) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .05em 0 var(--gold-edge)) drop-shadow(0 .12em .25em rgba(0,0,0,.35))}
.sub{margin:.4em 0 0;font-size:.86em;line-height:1.3;font-weight:600;color:var(--soft);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.body{grid-area:body;min-height:0;display:flex}
.body>*{flex:1;min-width:0;min-height:0}

/* month cards */
.months{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5em;min-height:0}
.mo{position:relative;container-type:size;container-name:card;min-height:0;border-radius:.85em;overflow:hidden;
  background:linear-gradient(165deg,var(--s2) 0%,var(--s1) 78%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 .3em .8em rgba(0,0,0,.28)}
.mo::before{content:"";position:absolute;inset:0 0 auto;height:.32em;background:var(--s3)}
.mo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 40%);pointer-events:none}
.mo-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:9cqh 4cqi 7cqh;text-align:center;gap:2cqh}
.mo-name{font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(8px,min(14cqi,10cqh),17px);line-height:1}
.mo-name .full{display:none}
.mo-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;gap:1.5cqh}
.badge{width:min(34cqh,46cqi);aspect-ratio:1;flex:none}
.hrs{display:flex;align-items:baseline;justify-content:center;gap:.18em;line-height:.9}
.hrs b{font-size:min(30cqh,50cqi);font-weight:900}
.hrs em{font-style:normal;font-weight:900;text-transform:uppercase;font-size:min(9cqh,12.5cqi);letter-spacing:.04em}
.ribbon{font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:min(8.5cqh,9.2cqi);line-height:1;max-width:100%;
  padding:.42em .55em;border-radius:999px;white-space:nowrap;background:rgba(0,0,0,.28);color:#fff}
.mo.earned{box-shadow:inset 0 0 0 2px var(--gold2),0 0 1.1em color-mix(in srgb,var(--gold2) 45%,transparent),0 .3em .8em rgba(0,0,0,.3)}
.mo.earned .ribbon{color:#3A2300;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold4));box-shadow:0 2px 0 var(--gold-edge)}
.mo.earned .mo-in{animation:stamp .6s cubic-bezier(.3,1.5,.5,1) both}
.mo.earned .sheen{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);
  animation:sheen 1.4s ease-out .7s 1 both}
.mo.none{filter:saturate(.35) brightness(.82)}
.mo.none .hrs{opacity:.9}
.mo.current{box-shadow:inset 0 0 0 2px var(--s3),0 .3em .8em rgba(0,0,0,.3)}
.mo.current .ribbon{background:var(--s3);color:#fff}
.mo.current .hrs b{color:transparent;-webkit-text-stroke:.045em #fff}
.mo.current .badge .hand{transform-origin:24px 24px;animation:spin 5.5s linear infinite}
.mo.future,.mo.pending{opacity:.62}
.mo.future .hrs b,.mo.pending .hrs b{color:transparent;-webkit-text-stroke:.04em rgba(255,255,255,.85)}
@container card (min-width:150px){ .mo-name .full{display:inline} .mo-name .short{display:none} }
@container card (max-height:115px){ .badge{display:none} }
@container card (max-height:80px){ .ribbon{display:none} }

/* reminder (no hours yet) */
.goals{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.6em;min-height:0}
.gcard{border-radius:.85em;background:var(--panel);box-shadow:inset 0 0 0 1px var(--panel-line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.gcard h2{margin:0;padding:.45em .8em;font-size:.86em;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:#2A1A00;
  background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold4))}
.gcard ol{list-style:none;margin:0;padding:.5em .8em;display:flex;flex-direction:column;justify-content:space-evenly;gap:.4em;flex:1}
.gcard li{display:flex;align-items:center;gap:.6em;font-weight:900;text-transform:uppercase;font-size:.92em;line-height:1.05}
.gcard li .n{color:var(--gold2)}
.gcard svg{flex:none;width:2em;height:2em}
.reset{border-radius:.85em;background:var(--panel);box-shadow:inset 0 0 0 1px var(--panel-line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4em;padding:.5em;text-align:center;min-height:0}
.reset svg{width:3.4em;height:3.4em;flex:none;overflow:visible;filter:drop-shadow(0 .08em .15em rgba(0,0,0,.35));animation:spin 4s linear infinite}
.reset b{font-weight:900;text-transform:uppercase;line-height:1.02;font-size:.95em}
.reset b span{display:block}

/* finale */
.finale{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.finale .big{font-weight:900;font-size:min(4.6em,30cqh);line-height:1;letter-spacing:-.02em}

.pills{grid-area:pills;display:flex;gap:.5em;flex-wrap:wrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:.45em;font-size:.82em;font-weight:800;padding:.42em .85em;border-radius:999px;
  background:var(--panel);box-shadow:inset 0 0 0 1px var(--panel-line);white-space:nowrap}
.pill b{font-size:1.25em;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums}
.pill .live{width:.5em;height:.5em;border-radius:50%;background:var(--orange);animation:pulse 1.5s ease-in-out infinite}
.fine{grid-area:fine;margin:0;font-size:.62em;font-weight:600;color:var(--soft);opacity:.9}
.hidden{display:none!important}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes status{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x,0),112cqh) rotate(var(--r,540deg))}}
@keyframes stamp{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}.confetti{display:none}}

/* Landscape */
@container frame (aspect-ratio > 3/2){
  .inner{font-size:clamp(9px,min(2.75cqw,5.2cqh),17px);gap:.45em;padding:.85em 1.1em .7em}
  .hero{max-width:74%}
  h1{font-size:1.55em}
  .balloons{width:15%;top:13%;right:-1%}
}
/* Portrait */
@container frame (aspect-ratio < 3/4){
  .inner{font-size:clamp(9px,min(4.5cqw,2.6cqh),18px);gap:.8em;grid-template-rows:auto auto minmax(0,1fr) auto auto}
  .top{flex-wrap:wrap;row-gap:.4em}
  .hero{max-width:100%;padding-top:2.5em}
  h1{font-size:1.9em}
  .balloons{width:30%;top:5.5%;right:-3%}
  .months{grid-template-columns:repeat(2,minmax(0,1fr));gap:.65em}
  .goals{grid-template-columns:1fr;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
  .pills{flex-direction:column;align-items:stretch}
}
@container frame (max-height:250px){ .sub,.fine{display:none} .reset{display:none} .goals{grid-template-columns:1fr} .glint{display:none} }
@container frame (max-width:340px) and (aspect-ratio > 3/4){ .reset{display:none} .goals{grid-template-columns:1fr} }
</style>
</head>

const START = new Date(2026,8,1), EARN_END = new Date(2027,0,1), SHOW_END = new Date(2027,1,1);
const pd = vars.previewDate ? new Date(vars.previewDate) : null;
const offset = (pd && !isNaN(pd)) ? pd.getTime() - Date.now() : 0;
const now = () => new Date(Date.now() + offset);

const $ = id => document.getElementById(id);
const show = (el,on) => el.classList.toggle('hidden',!on);
const hrWord = n => n===1 ? 'hour' : 'hours';
const dayWord = n => n===1 ? 'day' : 'days';
let lastKey = '';

function confetti(){
  const box = $('confetti'); if(box.childElementCount) return;
  const cols = ['#F9CB4E','#F07C22','#FFFFFF','#2BB3B1','#FFF4C9','#E5534B','#4FA3E0'];
  for(let i=0;i<42;i++){
    const c = document.createElement('i');
    const left = (i*37)%100 + ((i*13)%7)/7;              // spread evenly, deterministic
    c.style.left = left+'%';
    c.style.background = cols[i%cols.length];
    c.style.setProperty('--d',(2.6+(i%5)*.35)+'s');
    c.style.setProperty('--w',((i%9)*.09)+'s');
    c.style.setProperty('--x',(((i%7)-3)*9)+'px');
    c.style.setProperty('--r',(360+(i%4)*180)*(i%2?1:-1)+'deg');
    if(i%3===0){c.style.width='6px';c.style.height='6px';c.style.borderRadius='50%';}
    box.appendChild(c);
  }
}

function card(m,i,state,daysLeft){
  const li = document.createElement('li');
  li.className = `mo t-${m.key} ${state}`;
  const map = {
    earned:  {b:'1', em:'hour',  rib:'Earned!',      aria:`${m.full}: 1 hour earned`},
    none:    {b:'0', em:'hours', rib:'Not earned',   aria:`${m.full}: 0 hours earned`},
    current: {b:'1', em:'hour',  rib:`${daysLeft} ${dayWord(daysLeft)} left`, aria:`${m.full}: in progress, 1 hour up for grabs, ${daysLeft} ${dayWord(daysLeft)} left`},
    future:  {b:'1', em:'hour',  rib:'Up next',      aria:`${m.full}: up next`},
    pending: {b:'?', em:'hour',  rib:'Pending', aria:`${m.full}: results coming soon`}
  }[state];
  li.setAttribute('aria-label', map.aria);
  li.innerHTML = `<div class="mo-in" aria-hidden="true">
      <span class="mo-name"><span class="short">${m.short}</span><span class="full">${m.full}</span></span>
      <span class="mo-mid"><svg class="badge" viewBox="0 0 48 48"><use href="#clock"/></svg>
        <span class="hrs"><b class="${state==='earned'?'gold':''}">${map.b}</b><em>${map.em}</em></span></span>
      <span class="ribbon">${map.rib}</span></div>${state==='earned'?'<span class="sheen" aria-hidden="true"></span>':''}`;
  return li;
}

function render(){
  const t = now();
  const codes = record || '----';
  const earned = [...codes].filter(c=>c==='E').length;
  const curIdx = MONTHS.findIndex(x=>t.getFullYear()===x.y && t.getMonth()===x.m);
  const phase = t < START ? 'pre' : t < EARN_END ? 'active' : t < SHOW_END ? 'complete' : 'closed';
  const lastDay = curIdx>=0 ? new Date(MONTHS[curIdx].y, MONTHS[curIdx].m+1, 0).getDate() : 0;
  const daysLeft = curIdx>=0 ? lastDay - t.getDate() + 1 : 0;   // includes today
  const key = [phase,curIdx,daysLeft,t.toDateString()].join('|');
  if(key===lastKey) return; lastKey = key;

  const frame = $('frame');
  frame.className = 'frame t-' + (phase==='active' ? MONTHS[curIdx].key : phase==='pre' ? 'sep' : 'jan');
  let view = 'none', party = false, pills = false, fine = false;
  const set = (chip,a,b,sub) => { $('chipText').textContent=chip; $('h1a').textContent=a; $('h1b').textContent=b; $('sub').textContent=sub; };

  if(phase==='pre'){
    const d = Math.ceil((START - t)/86400000);
    set('Coming soon','Get ready to earn','Recognition hours!','Earn 1 hour every month you hit both goals, September through December.');
    view='goals'; pills=true;
    $('p1t').innerHTML = `Starts in <b>${d}</b> ${dayWord(d)}`; $('p2t').innerHTML = `<b>4</b> hours up for grabs`;
  } else if(phase==='active'){
    const m = MONTHS[curIdx], isFinal = curIdx===3, left = 4-curIdx;
    const chip = isFinal ? 'Final month!' : `${m.full} 2026`;
    if(earned>0){
      set(chip, "You've earned", `${earned} ${hrWord(earned)}!`,
          isFinal ? 'of Associate Recognition Time. December is your last chance to earn one more!'
                  : 'of Associate Recognition Time. Keep showing up! More opportunities to earn await you.');
      view='months'; party=true;
    } else {
      set(chip, "There's still time", 'to earn hours!',
          isFinal ? 'December is the final month. Hit both goals to earn 1 hour of Associate Recognition Time.'
                  : 'Hit both goals this month to earn 1 hour of Associate Recognition Time.');
      view='goals';
    }
    pills=true; fine=earned>0;
    $('p1t').innerHTML = daysLeft===1 ? `<b>Last day</b> to earn in ${m.full}!` : `<b>${daysLeft}</b> ${dayWord(daysLeft)} left in ${m.full}`;
    $('p2t').innerHTML = isFinal ? `<b>Final</b> month to earn` : `<b>${left}</b> months left to earn`;
  } else if(phase==='complete'){
    if(earned>0){
      set('Program complete','Congratulations!',`You earned ${earned} ${hrWord(earned)}!`,
          codes[3]==='-' ? 'December results will appear here once they are posted.' : 'of Associate Recognition Time. Thank you for showing up!');
      view='months'; party=true; fine=true;
    } else if(record && codes[3]==='-'){
      set('Program complete','Final results','Coming soon!','December results will appear here once they are posted.');
    } else {
      set('Program complete','Happy','New Year!','The attendance program is over. Thanks for being part of the pilot!');
      view='finale'; $('big').textContent='2027'; party=true;
    }
  } else {
    set('Program ended','Thank you','for showing up!','The attendance program has ended. Happy New Year!');
    view='finale'; $('big').textContent='2027';
  }

  const months = $('months');
  if(view==='months'){
    months.innerHTML = '';
    MONTHS.forEach((m,i)=>{
      const c = codes[i];
      let st = c==='E' ? 'earned' : c==='N' ? 'none'
             : (phase==='active' && i===curIdx) ? 'current'
             : (phase==='active' && i>curIdx) ? 'future' : 'pending';
      months.appendChild(card(m,i,st,daysLeft));
    });
  }
  show(months,view==='months'); show($('goals'),view==='goals'); show($('finale'),view==='finale');
  show($('pills'),pills); show($('fine'),fine);
  if(party) confetti();
}
render();
setInterval(render, 60000);   // days-remaining only; re-checks for day/month rollover each minute

// Admin test mode: add &debug=1 to the widget URL. Digits are masked so IDs are never shown in full.
if(vars.debug){
  const mask = v => v==null ? '(not sent)' : String(v).replace(/\d(?=\d{2})/g,'•');
  const d = document.createElement('div');
  d.style.cssText='position:absolute;left:6px;right:6px;bottom:6px;z-index:9;font:11px/1.35 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.82);color:#fff;padding:6px 8px;border-radius:8px;white-space:pre-wrap;word-break:break-all';
  d.textContent = `employeeId: ${mask(PARAM_MAP['employeeid'])}\nemployeeCode: ${mask(PARAM_MAP['employeecode'])}\nmatched: ${matchedBy ? 'yes, via '+matchedBy : 'no'}   data built: ${DATA.updated}   results through: ${DATA.resultsThrough || 'none'}`;
  document.getElementById('frame').appendChild(d);
}
</script>
</body>
</html>
