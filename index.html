<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Attendance Program Reminder</title>
<style>
:root{
  --bg:#0D2440; --bg2:#103B57; --ink:#F6F1E7; --muted:#A9BDCD; --line:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.07); --gold:#F2B33D; --gold-ink:#0D2440; --orange:#F07C22; --teal:#2BB3B1;
  --maroon:#8E2236; --track:rgba(255,255,255,.14);
  --ok:#3DBE7A; --warn:#F2B33D; --bad:#E5534B;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#FFFFFF; --bg2:#E9F3F6; --ink:#0D2440; --muted:#4A6175; --line:rgba(13,36,64,.16);
    --panel:#F1F6F9; --gold:#D4920F; --gold-ink:#FFFFFF; --orange:#D9630F; --teal:#127A7A;
    --track:rgba(13,36,64,.12); color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;height:100%}
body{display:flex;align-items:flex-start;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased}
.frame{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;overflow:hidden;border-radius:16px;
  container-type:size;container-name:frame;
  background:linear-gradient(140deg,var(--bg) 0 58%,var(--bg2) 100%)}
.frame::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:1;
  background:linear-gradient(90deg,var(--teal),var(--orange) 55%,var(--gold))}
.inner{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "main" "meta" "fine";
  gap:.75em;padding:1.15em 1.2em .9em;font-size:clamp(9px,min(3.3cqw,4.4cqh),18px)}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:.6em;min-width:0}
.title{font-size:.82em;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;display:inline-flex;align-items:center;gap:.45em;font-size:.74em;font-weight:700;
  padding:.3em .75em;border-radius:999px;border:1px solid var(--orange);color:var(--ink)}
.chip .dot{width:.55em;height:.55em;border-radius:50%;background:var(--orange);animation:status 2s ease-in-out infinite}
.chip.done{border-color:var(--gold)} .chip.done .dot{background:var(--gold);animation:none}
.main{grid-area:main;display:flex;flex-direction:column;justify-content:center;gap:.5em;min-height:0}
h1{margin:0;font-size:1.38em;line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:0;font-size:.88em;line-height:1.38;color:var(--muted);max-width:34em}
.metric{font-size:.72em;color:var(--muted);margin:.15em 0 -.2em}
.tokens{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55em}
.tok{display:flex;flex-direction:column;align-items:center;gap:.22em;min-width:0;text-align:center}
.dial{position:relative;width:min(100%,4.2em,17cqh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  border:.17em solid var(--track);font-weight:800;font-size:1em}
.dial b{font-size:1.45em;line-height:1;font-variant-numeric:tabular-nums}
.tok .m{font-size:.8em;font-weight:700}
.tok .c{font-size:.68em;color:var(--muted);white-space:nowrap}
.tok.earned .dial{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);
  box-shadow:0 0 0 .22em color-mix(in srgb,var(--gold) 22%,transparent)}
.tok.earned .c{color:var(--ink);font-weight:600}
.tok.none .dial{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.tok.current .dial{border-color:transparent;color:var(--orange)}
.tok.current .dial::before{content:"";position:absolute;inset:-.17em;border-radius:50%;
  background:conic-gradient(var(--orange) calc(var(--p,0) * 1turn),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - .19em),#000 calc(100% - .17em));
          mask:radial-gradient(farthest-side,transparent calc(100% - .19em),#000 calc(100% - .17em))}
.tok.future .dial,.tok.pending .dial{color:var(--muted);opacity:.75}
.goals{list-style:none;margin:.1em 0 0;padding:0;display:grid;gap:.45em}
.goals li{display:flex;align-items:center;gap:.65em;font-weight:700;font-size:.98em}
.goals .ic{flex:none;width:1.9em;height:1.9em;border-radius:.5em;display:grid;place-items:center;background:var(--panel)}
.goals svg{width:1.15em;height:1.15em;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meta{grid-area:meta;display:flex;gap:.6em;min-width:0}
.box{flex:1 1 0;min-width:0;padding:.5em .75em;border-radius:.7em;background:var(--panel);display:flex;flex-direction:column;justify-content:center;gap:.12em}
.box.cd{flex-grow:1.55}
.lbl{font-size:.7em;color:var(--muted);display:flex;align-items:center;gap:.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-size:1.3em;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.val small{font-size:.62em;font-weight:700;color:var(--muted);margin:0 .25em 0 .08em}
.live{width:.5em;height:.5em;border-radius:50%;background:var(--orange);animation:pulse 1.5s ease-in-out infinite}
.fine{grid-area:fine;margin:0;font-size:.64em;line-height:1.3;color:var(--muted)}
.hidden{display:none!important}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes status{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes land{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tok.earned .dial{animation:land .5s cubic-bezier(.3,1.4,.5,1) both}
.tok:nth-child(2) .dial{animation-delay:.08s}.tok:nth-child(3) .dial{animation-delay:.16s}.tok:nth-child(4) .dial{animation-delay:.24s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
/* Landscape: two columns */
@container frame (aspect-ratio > 3/2){
  .dial{width:min(100%,3.8em,24cqh)}
  .inner{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top" "main meta" "fine fine";font-size:clamp(9px,min(2.9cqw,5.6cqh),17px);gap:.6em 1em}
  .meta{flex-direction:column;justify-content:center}
  .box,.box.cd{flex:0 0 auto}
}
/* Portrait: roomier tokens */
@container frame (aspect-ratio < 3/4){
  .inner{font-size:clamp(9px,min(4.6cqw,2.8cqh),18px);gap:.9em}
  .top{flex-wrap:wrap;row-gap:.4em}
  .tokens{grid-template-columns:repeat(2,minmax(0,1fr));gap:1em .8em}
  .dial{width:min(100%,5.2em,10cqh)}
  h1{font-size:1.55em}
}
@container frame (max-height: 230px){ .sub,.fine,.metric{display:none} .inner{gap:.45em;padding-top:.9em} }
@container frame (max-height: 320px) and (aspect-ratio > 3/2){ .sub{display:none} }
</style>
</head>

  </div>
</div>

const params = new URLSearchParams(window.location.search);
const vars = {
  externalLocationId: params.get('externalLocationId') || null,
  externalLocationCode: params.get('externalLocationCode') || null,
  address: params.get('address') || null,
  city: params.get('city') || null,
  stateOrProvince: params.get('stateOrProvince') || null,
  country: params.get('country') || null,
  zipCode: params.get('zipCode') || null,
  externalRegionId: params.get('externalRegionId') || null,
  externalRegionCode: params.get('externalRegionCode') || null,
  employeeId: params.get('employeeId') || null,
  employeeCode: params.get('employeeCode') || null,
  username: params.get('username') || null,
  language: params.get('language') || 'en',
  aspectRatio: params.get('aspectRatio') || 'standard',
  // custom: QA-only date override (ISO timestamp). Ignored if invalid.
  previewDate: params.get('previewDate') || null
};
const RATIOS = { standard: '4 / 3', square: '1 / 1', landscape: '16 / 9', portrait: '9 / 16' };
const RATIO_NUM = { standard: 4/3, square: 1, landscape: 16/9, portrait: 9/16 };
const frame = document.querySelector('.frame');
frame.style.aspectRatio = RATIOS[vars.aspectRatio] || RATIOS.standard;
function fit(){
  const r = RATIO_NUM[vars.aspectRatio] || RATIO_NUM.standard;
  const w = Math.min(document.documentElement.clientWidth || 520, 520, (window.innerHeight || 9999) * r);
  frame.style.width = Math.max(200, Math.floor(w)) + 'px';
}
fit(); window.addEventListener('resize', fit);

// Compact SHA-256 (ASCII input) so the lookup works on any host, including file://
function sha256(s){function rr(v,a){return(v>>>a)|(v<<(32-a))}var P=Math.pow,M=P(2,32),i,j,out='',w=[],L=s.length*8,h=[],k=[],n=0,C={};
for(var c=2;n<64;c++){if(!C[c]){for(i=0;i<313;i+=c)C[i]=c;h[n]=(P(c,.5)*M)|0;k[n++]=(P(c,1/3)*M)|0}}
h=h.slice(0,8);s+='\x80';while(s.length%64-56)s+='\x00';for(i=0;i<s.length;i++){j=s.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}
w[w.length]=(L/M)|0;w[w.length]=L;for(j=0;j<w.length;){var W=w.slice(j,j+=16),o=h;h=h.slice(0,8);
for(i=0;i<64;i++){var a=W[i-15],b=W[i-2],A=h[0],E=h[4];var t1=h[7]+(rr(E,6)^rr(E,11)^rr(E,25))+((E&h[5])^(~E&h[6]))+k[i]+(W[i]=i<16?W[i]:(W[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+W[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0);

for(i=0;i<8;i++)h[i]=(h[i]+o[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var x=(h[i]>>(j*8))&255;out+=(x<16?'0':'')+x.toString(16)}return out}

function normId(v){ if(!v) return null; v=String(v).trim(); if(!/^\d+$/.test(v)) return null; return v.replace(/^0+(?=\d)/,''); }
function lookup(id){ const n=normId(id); if(!n||!DATA.salt) return null; return DATA.r[sha256(DATA.salt+':'+n).slice(0,12)] || null; }
const record = lookup(vars.employeeId);   // e.g. "EN--" : E earned, N not earned, - not posted yet

const MONTHS = [
  {y:2026,m:8,short:'Sep',full:'September'},{y:2026,m:9,short:'Oct',full:'October'},
  {y:2026,m:10,short:'Nov',full:'November'},{y:2026,m:11,short:'Dec',full:'December'}];
const START = new Date(2026,8,1), EARN_END = new Date(2027,0,1), SHOW_END = new Date(2027,1,1);
const pd = vars.previewDate ? new Date(vars.previewDate) : null;
const offset = (pd && !isNaN(pd)) ? pd.getTime() - Date.now() : 0;
const now = () => new Date(Date.now() + offset);

const $ = id => document.getElementById(id);
const show = (el,on) => el.classList.toggle('hidden',!on);
const plural = n => n===1 ? 'hour' : 'hours';
let target = null, curIdx = -1, monthStart = null;

function render(){
  const t = now();
  const codes = record || '----';
  const earned = [...codes].filter(c=>c==='E').length;
  curIdx = MONTHS.findIndex(x=>t.getFullYear()===x.y && t.getMonth()===x.m);
  const phase = t < EARN_END ? 'active' : (t < SHOW_END ? 'complete' : 'closed');
  const chip=$('chip'), tokens=$('tokens');
  chip.classList.toggle('done', phase!=='active');
  let showTokens=false, showGoals=false, showMeta=false, showFine=false;

  if(phase==='active'){
    const pre = t < START;
    const isFinal = curIdx===3;
    $('chipText').textContent = pre ? 'Starts in September' : (isFinal ? 'Final month' : MONTHS[curIdx].full);
    showMeta = true; showFine = true;
    if(earned>0){
      $('headline').textContent = `You've earned ${earned} recognition ${plural(earned)} so far.`;
      $('sub').textContent = isFinal ? 'December is your last chance to earn. Keep showing up!'
                                     : 'Keep showing up. Each month is a new chance to earn.';
      showTokens = true;
    } else {
      $('headline').textContent = "There's still time to earn recognition hours.";
      $('sub').textContent = isFinal ? 'December is the final month. Hit both goals to earn 1 hour.'
                                     : 'Hit both goals this month to earn 1 hour. Each month is a clean slate.';
      showGoals = true;
    }
    if(pre){ target = START; monthStart = null; $('cdLabel').textContent='Program starts in'; $('mlVal').textContent='4'; }
    else {
      const m = MONTHS[curIdx]; monthStart = new Date(m.y,m.m,1); target = new Date(m.y,m.m+1,1);
      $('cdLabel').textContent = isFinal ? 'Time left to earn' : `Time left in ${m.full}`;
      const left = 4-curIdx;
      $('mlVal').innerHTML = isFinal ? '1<small>final</small>' : String(left);
    }
  } else if(phase==='complete'){
    $('chipText').textContent = 'Program complete';
    target = null;
    if(earned>0){
      $('headline').textContent = `You earned ${earned} recognition ${plural(earned)}. Nice work!`;
      $('sub').textContent = codes[3]==='-' ? 'December results will appear here once they are posted.'
                                            : 'Thanks for showing up for your team this fall.';
      showTokens = true; showFine = true;
    } else if(record && codes[3]==='-'){
      $('headline').textContent = 'Final results are on the way.';
      $('sub').textContent = 'December results will appear here once they are posted.';
    } else {
      $('headline').textContent = 'The attendance program is over. Happy New Year!';
      $('sub').textContent = 'Thanks for being part of the pilot this fall.';
    }
  } else {
    $('chipText').textContent = 'Program ended';
    target = null;
    $('headline').textContent = 'The attendance program has ended.';
    $('sub').textContent = 'Thanks for being part of the pilot. Happy New Year!';
  }

  if(showTokens){
    tokens.innerHTML = '';
    MONTHS.forEach((m,i)=>{
      const c = codes[i]; let cls, v, cap, aria;
      if(c==='E'){cls='earned';v='1';cap='1 of 1 hr';aria=`${m.full}: 1 of 1 hour earned`;}
      else if(c==='N'){cls='none';v='0';cap='0 of 1 hr';aria=`${m.full}: 0 of 1 hour earned`;}
      else if(phase==='active' && i===curIdx){cls='current';v='–';cap='In progress';aria=`${m.full}: in progress`;}
      else if(phase==='active' && i>curIdx){cls='future';v='–';cap='Up next';aria=`${m.full}: up next`;}
      else {cls='pending';v='–';cap='Pending';aria=`${m.full}: results pending`;}
      const li=document.createElement('li'); li.className='tok '+cls; li.setAttribute('aria-label',aria);
      li.innerHTML=`<span class="dial" aria-hidden="true"><b>${v}</b></span><span class="m" aria-hidden="true">${m.short}</span><span class="c" aria-hidden="true">${cap}</span>`;
      tokens.appendChild(li);
    });
  }
  show(tokens,showTokens); show($('metric'),showTokens); show($('goals'),showGoals);
  show($('meta'),showMeta); show($('fine'),showFine);
  tick();
}

function pad(n){return String(n).padStart(2,'0')}
function tick(){
  if(!target) return;
  const t = now(); let ms = target - t;
  if(ms <= 0){ render(); return; }
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), mi = Math.floor(s%3600/60), se = s%60;
  $('cdVal').innerHTML = `${d}<small>${d===1?'day':'days'}</small>${pad(h)}:${pad(mi)}:${pad(se)}`;
  if(monthStart){
    const p = Math.min(1,Math.max(0,(t-monthStart)/(target-monthStart)));
    const cur = document.querySelector('.tok.current'); if(cur) cur.style.setProperty('--p',p.toFixed(4));
  }
}
render();
setInterval(tick, 1000);
</script>
